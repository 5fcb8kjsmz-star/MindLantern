<!DOCTYPE html>
<html>
<head>
    <title>Quote - MindLantern</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            font-family:Arial, sans-serif;
            margin:0;
            background:#FDF6E3;
            color:#3E2723;
            overflow:hidden;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#D2B48C;
            padding:12px 30px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            position:sticky;
            top:0;
            z-index:100;
        }

        nav .logo-container span{
            font-size:1.5rem;
            font-weight:bold;
            color:#3E2723;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:18px;
            margin:0;
            padding:0;
        }

        nav ul li a{
            text-decoration:none;
            color:#FFF8EF;
            font-weight:bold;
        }

        nav ul li a:hover{
            opacity:0.85;
        }

        /* ================= LAYOUT FIX ================= */
        .layout{
            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:20px;
            padding:60px 20px;
        }

        .container{
            flex:1;
            display:flex;
            justify-content:center;
        }

        /* ================= CARD ================= */
        .card{
            background:rgba(255,255,255,0.82);
            backdrop-filter:blur(6px);
            width:100%;
            max-width:700px;
            padding:40px 35px;
            border-radius:24px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.06);
            position:relative;
            z-index:2;
        }

        .card h1{
            color:#8B5E3C;
            margin-bottom:25px;
            font-size:2rem;
        }

        #quote{
            font-size:1.25rem;
            line-height:1.9;
            color:#5C4033;
            margin-bottom:30px;
            min-height:70px;
        }

        .card button{
            padding:13px 24px;
            border:none;
            border-radius:14px;
            background:#8B5E3C;
            color:white;
            font-size:1rem;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
        }

        .card button:hover{
            transform:scale(1.03);
        }

        /* ================= MUSIC PANEL ================= */
        .music-panel{
            width:280px;
            background:rgba(255,255,255,0.85);
            border-radius:20px;
            padding:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            position:sticky;
            top:100px;
            height:fit-content;
        }

        .music-panel h3{
            text-align:center;
            color:#8B5E3C;
        }

        .music-panel input{
            width:100%;
            padding:8px;
            margin-top:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        .music-panel button{
            width:100%;
            margin-top:10px;
            padding:8px;
            border:none;
            border-radius:8px;
            background:#8B5E3C;
            color:white;
            cursor:pointer;
        }

        .music-panel iframe{
            width:100%;
            margin-top:10px;
            border-radius:12px;
        }

        canvas{
            position:fixed;
            top:0;
            left:0;
            pointer-events:none;
            z-index:1;
        }

    </style>
</head>

<body onload="protect(); loadMusic()">

<canvas id="confetti"></canvas>

<nav>
    <div class="logo-container">
        <span>MindLantern</span>
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="quote.html">Quote</a></li>
        <li><a href="write.html">Write</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>
</nav>

<!-- ================= MAIN LAYOUT ================= -->
<div class="layout">

    <div class="container">

        <div class="card">

            <h1>Motivational Quote</h1>

            <p id="quote">
                Click the button below to receive a motivational quote.
            </p>

            <button onclick="newQuote(); burstConfetti();">
                New Quote
            </button>

        </div>

    </div>

    <!-- ================= MUSIC RIGHT SIDE ================= -->
    <div class="music-panel">

        <h3>🎵 Music</h3>

        <input id="musicUrl" placeholder="Spotify / YouTube link">
        <button onclick="setMusic()">Save</button>

        <div id="musicBox"></div>

    </div>

</div>

<script>

/* ---------------- PROTECT ---------------- */
function protect(){
    if(localStorage.getItem("loggedIn") !== "true"){
        window.location.href = "login.html";
    }
}

/* ---------------- LOGOUT ---------------- */
function logout(){
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
}

/* ---------------- QUOTES ---------------- */
const quotes = [
    "The only way to do great work is to love what you do. — Steve Jobs",
    "It always seems impossible until it’s done. — Nelson Mandela",
    "Believe you can and you’re halfway there. — Theodore Roosevelt",
    "Don’t watch the clock; do what it does. Keep going. — Sam Levenson",
    "Success is not final, failure is not fatal: it is the courage to continue that counts. — Winston Churchill",
    "Hardships often prepare ordinary people for an extraordinary destiny. — C.S. Lewis",
    "You miss 100% of the shots you don’t take. — Wayne Gretzky",
    "The future belongs to those who believe in the beauty of their dreams. — Eleanor Roosevelt",
    "In the middle of difficulty lies opportunity. — Albert Einstein",
    "Do what you can, with what you have, where you are. — Theodore Roosevelt"
];

function newQuote(){
    document.getElementById("quote").innerText =
        quotes[Math.floor(Math.random()*quotes.length)];
}

/* ---------------- MUSIC (FIXED) ---------------- */
function setMusic(){
    let url=document.getElementById("musicUrl").value.trim();
    if(!url) return;

    // Spotify
    if(url.includes("open.spotify.com")){
        url=url.replace("open.spotify.com/","open.spotify.com/embed/");
    }

    // YouTube
    if(url.includes("watch?v=")){
        url=url.replace("watch?v=","embed/");
    }

    if(url.includes("youtu.be/")){
        url=url.replace("youtu.be/","www.youtube.com/embed/");
    }

    localStorage.setItem("musicUrl",url);
    loadMusic();
}

function loadMusic(){
    let url=localStorage.getItem("musicUrl");
    if(!url) return;

    document.getElementById("musicBox").innerHTML=
    `<iframe src="${url}" height="160" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
}

/* ---------------- CONFETTI (UNCHANGED) ---------------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const colors = ["#ff4d4d","#ffb84d","#fff94d","#4dff88","#4dd2ff","#b84dff","#ff4df2"];

let particles = [];

function burstConfetti(){
    for(let i=0;i<160;i++){
        particles.push({
            x: window.innerWidth/2,
            y: window.innerHeight/3,
            vx: (Math.random()-0.5)*8,
            vy: (Math.random()-1.8)*8,
            size: Math.random()*6+2,
            color: colors[Math.floor(Math.random()*colors.length)],
            alpha: 1,
            gravity: 0.15,
            shape: Math.random() > 0.5 ? "circle" : "square"
        });
    }
    animate();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.008;

        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;

        if(p.shape === "circle"){
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fill();
        }else{
            ctx.fillRect(p.x,p.y,p.size,p.size);
        }

        if(p.alpha <= 0){
            particles.splice(i,1);
        }
    });

    ctx.globalAlpha = 1;

    if(particles.length > 0){
        requestAnimationFrame(animate);
    }
}

</script>

</body>
</html>
